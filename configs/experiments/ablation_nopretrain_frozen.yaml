# Ablation: no pretraining and frozen backbone; train head only. MIMIC only.
# Usage: sbatch scripts/<site>/run.sh mimic ablation_nopretrain_frozen mistral <task>

extends:
  - ../shared/training_classifier.yaml

name: "mimic_ablation_nopretrain_frozen_{model}_{task}"

wandb:
  run_name: "ablation-nopretrain-frozen-{model}-{task}"

model:
  pretrained_checkpoint: null
  num_labels: 2
  freeze_llm: true
  train_lora: false
  pooling: "last_token"
  load_in_4bit: true

output_dir: "{results_root}/mimic-ablation_nopretrain_frozen-{model}-{task}"

training:
  output_dir: "{results_root}/mimic-ablation_nopretrain_frozen-{model}-{task}"
  learning_rate: 1e-4
  eval_steps: 1000
  save_steps: 1000
