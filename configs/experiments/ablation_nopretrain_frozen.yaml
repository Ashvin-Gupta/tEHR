# Ablation: no pretraining and frozen backbone; train head only.
# Usage: sbatch scripts/<site>/run.sh <dataset> ablation_nopretrain_frozen mistral <task>
# Allowed datasets: mimic, ehrshot.

extends:
  - ../shared/training_classifier.yaml

name: "{dataset}_ablation_nopretrain_frozen_{model}_{task}"

wandb:
  run_name: "ablation-nopretrain-frozen-{dataset}-{model}-{task}"

model:
  pretrained_checkpoint: null
  num_labels: 2
  freeze_llm: true
  train_lora: false
  pooling: "last_token"
  load_in_4bit: true

output_dir: "{results_root}/{dataset}-ablation_nopretrain_frozen-{model}-{task}"

training:
  output_dir: "{results_root}/{dataset}-ablation_nopretrain_frozen-{model}-{task}"
  learning_rate: 1e-4
  eval_steps: 1000
  save_steps: 1000
