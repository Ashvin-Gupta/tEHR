# Ablation: CPT then frozen backbone; train head only.
# Usage: sbatch scripts/<site>/run.sh <dataset> ablation_cpt_frozen mistral <task>
# Allowed datasets: mimic.

extends:
  - ../shared/training_classifier.yaml

name: "{dataset}_ablation_cpt_frozen_{model}_{task}"

wandb:
  run_name: "ablation-cpt-frozen-{dataset}-{model}-{task}"

model:
  num_labels: 2
  freeze_llm: true
  train_lora: false
  pooling: "last_token"

training:
  output_dir: "{results_root}/{dataset}-ablation_cpt_frozen-{model}-{task}"
  learning_rate: 1e-4
