# Custom transformer encoder: stage-1 MLM + supervised head.
# Usage: sbatch scripts/<site>/run.sh <dataset> encoder <task>

name: "{dataset}_encoder_{task}"

model:
  vocab_size: null
  hidden_dim: 512
  num_layers: 6
  num_heads: 8
  ff_dim: 2048
  dropout: 0.1
  max_seq_length: 2048
  num_labels: 2
  head_type: "linear"
  head_hidden_size: 256
  pooling: "mean"

training:
  output_dir: "{results_root}/{dataset}-encoder-{task}"
  overwrite_output_dir: true
  epochs: 1
  batch_size: 16
  learning_rate: 1e-4
  weight_decay: 0.01
  dataloader_num_workers: 2
  eval_epoch_fractions: [0.05, 0.10, 0.20, 0.40, 0.60, 0.80, 1.00]

pretrain:
  enabled: true
  pretrained_checkpoint: "{encoder_mlm_checkpoint}"
  force_pretrain: false
  use_all_splits_for_mimic: true  # MIMIC only. EHRSHOT stage-1 is unlabeled train.
  epochs: 30
  batch_size: 16
  learning_rate: 1e-4
  weight_decay: 0.01
  mlm_probability: 0.15
  dataloader_num_workers: 2
