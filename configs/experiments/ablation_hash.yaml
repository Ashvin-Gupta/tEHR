# Lexical ablation: scramble titles → Concept_<hash> IDs. MIMIC only.
# Usage: sbatch scripts/<site>/run.sh mimic ablation_hash mistral <task>

extends:
  - ../shared/lora.yaml
  - ../shared/training_classifier.yaml

name: "mimic_ablation_hash_{model}_{task}"

wandb:
  run_name: "ablation-hash-{model}-{task}"

data:
  surface_form: scramble_hash
  scramble_seed: 42

model:
  pretrained_checkpoint: null
  num_labels: 2
  freeze_llm: true
  train_lora: true
  pooling: "mean"

training:
  output_dir: "{results_root}/mimic-ablation_hash-{model}-{task}"
  learning_rate: 1e-5
