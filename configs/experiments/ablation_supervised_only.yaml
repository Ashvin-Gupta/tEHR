# Ablation: no EHR pretraining; fresh LLM + LoRA + head.
# Usage: sbatch scripts/<site>/run.sh <dataset> ablation_supervised_only mistral <task>
# Allowed datasets: mimic.

extends:
  - ../shared/lora.yaml
  - ../shared/training_classifier.yaml

name: "{dataset}_ablation_supervised_only_{model}_{task}"

wandb:
  run_name: "ablation-supervised-only-{dataset}-{model}-{task}"

model:
  pretrained_checkpoint: null
  num_labels: 2
  freeze_llm: true
  train_lora: true
  pooling: "mean"

training:
  output_dir: "{results_root}/{dataset}-ablation_supervised_only-{model}-{task}"
  learning_rate: 1e-5
