# Stage-2 ablation: same CPT + linear head, timestamps stripped from the text.
# Usage: sbatch scripts/<site>/run.sh <dataset> ablation_no_time mistral <task>

extends:
  - ../shared/lora.yaml
  - ../shared/training_classifier.yaml

name: "{dataset}_ablation_no_time_{model}_{task}"

wandb:
  run_name: "ablation-no-time-{dataset}-{model}-{task}"

data:
  drop_time: true

model:
  num_labels: 2
  freeze_llm: true
  train_lora: true
  pooling: "last_token"

training:
  output_dir: "{results_root}/{dataset}-ablation_no_time-{model}-{task}"
  learning_rate: 1e-6
