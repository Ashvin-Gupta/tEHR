data:
  dataset: "EHRSHOT"
  data_dir: "{ehrshot.data_dir}"
  vocab_filepath: "{ehrshot.vocab_filepath}"
  concept_csv: "{ehrshot.concept_csv}"
  task: "prediction"
  sort_by_length: true
  label_column: "label"

# Re-applied last in build_config for classifier experiments (not tehr_stage1)
# so experiment / local.yaml cannot restore the 7-point schedule. Mid-train
# evals only; final val/test still run.
training:
  eval_epoch_fractions: [0.25, 0.50, 0.75]
  eval_steps: 100000
  eval_max_batches: 32

wandb:
  project: "tEHR-classification"

prompt:
  filepath: "src/resources/probability_task_prompt.txt"
