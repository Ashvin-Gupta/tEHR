# Shared training defaults for tEHR stage 2 / ablation classifier runs.

wandb:
  enabled: true
  project: "tEHR-classification"

training:
  epochs: 1
  batch_size: 8
  eval_batch_size: 8
  weight_decay: 0.01
  warmup_steps: 100
  gradient_accumulation_steps: 2
  fp16: false
  bf16: true
  logging_steps: 10
  eval_epoch_fractions: [0.05, 0.10, 0.20, 0.40, 0.60, 0.80, 1.00]
  eval_steps: 1000
  save_steps: 1000
  save_total_limit: 2
  load_in_4bit: true
  save_model: false
  dataloader_num_workers: 0
  overwrite_output_dir: true
