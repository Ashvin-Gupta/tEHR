# src/configs_isambard/baseline_encoder_transformer_mimic_config.yaml
# Template: ${HOME} and ${PROJECTDIR} are expanded at runtime by envsubst.

name: "encoder_transformer_baseline_mimic"

model:
  vocab_size: null
  hidden_dim: 512
  num_layers: 6
  num_heads: 8
  ff_dim: 2048
  dropout: 0.1
  max_seq_length: 512
  num_labels: 2
  head_type: "linear"
  head_hidden_size: 256
  pooling: "mean"

training:
  output_dir: "${PROJECTDIR}/TextCancEHR2/experiments/Results/mimic-baselines/encoder_transformer"
  overwrite_output_dir: true
  epochs: 10
  batch_size: 512
  learning_rate: 1e-4
  weight_decay: 0.01
  dataloader_num_workers: 2

pretrain:
  enabled: true
  pretrained_checkpoint: "${PROJECTDIR}/TextCancEHR2/experiments/Results/mimic-baselines/encoder_transformer/models/pretrained_encoder_stage1_mlm.pt"
  force_pretrain: false
  use_all_splits_for_mimic: true
  epochs: 20
  batch_size: 64
  learning_rate: 1e-4
  weight_decay: 0.01
  mlm_probability: 0.15
  dataloader_num_workers: 2

data:
  data_dir: "${HOME}/MIMIC-IV_tokenisation"
  vocab_filepath: "${HOME}/MIMIC-IV_tokenisation/vocab.csv"
  aces_label_dir: "${HOME}/MIMIC_data/labels/hospital_readmission"
  lookup_dir: "${HOME}/MIMIC_data/hosp"
  dataset: "MIMIC"
  task: "prediction"
  label_column: "label"
