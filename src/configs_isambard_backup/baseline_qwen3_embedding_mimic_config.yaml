# src/configs_isambard/baseline_qwen3_embedding_mimic_config.yaml
# Template: ${HOME} and ${PROJECTDIR} are expanded at runtime by envsubst.

name: "qwen3_embedding_baseline_mimic"

model:
  model_name: "Qwen/Qwen3-Embedding-8B"
  hidden_size: 4096
  num_labels: 2
  head_dropout: 0.1
  max_length: 2024
  use_lora: true
  lora:
    r: 16
    lora_alpha: 16
    lora_dropout: 0.05
    bias: "none"
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj

pretrain:
  enabled: false
  use_all_splits_for_mimic: true
  max_length: 1024
  mlm_probability: 0.15
  add_mask_token: true
  epochs: 1
  batch_size: 8
  eval_batch_size: 8
  learning_rate: 2e-5
  weight_decay: 0.01
  warmup_steps: 100
  gradient_accumulation_steps: 1
  fp16: false
  bf16: true
  logging_steps: 50
  eval_steps: 250
  save_steps: 500
  save_total_limit: 2
  dataloader_num_workers: 4

wandb:
  enabled: true
  project: "MIMIC-IV-baselines"
  run_name: "baseline-qwen3-embedding-8b-mimic"

training:
  output_dir: "${PROJECTDIR}/TextCancEHR2/experiments/Results/mimic-baselines/qwen3-embedding-8B"
  overwrite_output_dir: true
  epochs: 1
  batch_size: 2
  eval_batch_size: 2
  learning_rate: 1e-5
  weight_decay: 0.01
  warmup_steps: 500
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  fp16: false
  bf16: true
  logging_steps: 50
  eval_steps: 50
  save_steps: 50
  save_total_limit: 2
  dataloader_num_workers: 4

data:
  data_dir: "${HOME}/MIMIC-IV_tokenisation"
  vocab_filepath: "${HOME}/MIMIC-IV_tokenisation/vocab.csv"
  aces_label_dir: "${HOME}/MIMIC_data/labels/hospital_readmission"
  lookup_dir: "${HOME}/MIMIC_data/hosp"
  dataset: "MIMIC"
  task: "prediction"
  label_column: "label"
