# src/configs_isambard/mimic_pretrain.yaml
# Template: ${HOME} and ${PROJECTDIR} are expanded at runtime by envsubst.

name: "llama_pretraining"

model:
  model_name: "unsloth/mistral-7b-v0.3-bnb-4bit"
  max_length: 16384
  hf_token: null

wandb:
  enabled: true
  project: "Pretrain-MIMIC"
  run_name: "Pretrain-Mistral-7B"

lora:
  r: 16
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"

training:
  output_dir: "${PROJECTDIR}/TextCancEHR2/experiments/Results/Pretrain-Mistral-7B-Mimic"
  overwrite_output_dir: true
  epochs: 1
  batch_size: 4
  eval_batch_size: 4
  learning_rate: 1e-5
  weight_decay: 0.05
  warmup_steps: 500
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  fp16: false
  bf16: true
  logging_steps: 10
  eval_steps: 500
  save_steps: 1000
  save_total_limit: 3

data:
  cutoff_months: 1
  data_dir: "${HOME}/MIMIC-IV_tokenisation"
  vocab_filepath: "${HOME}/MIMIC-IV_tokenisation/vocab.csv"
  aces_label_dir: "${HOME}/MIMIC_data/labels/icu_mortality"
  lookup_dir: "${HOME}/MIMIC_data/hosp"
  dataset: "MIMIC"
