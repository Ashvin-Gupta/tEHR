# src/configs_isambard/baseline_text_embedding_transformer_mimic_config.yaml
# Template: ${HOME}, ${PROJECTDIR}, and ${EMBEDDINGS_PATH} expanded at runtime by envsubst.

name: "text_embedding_transformer_mimic"

embedder:
  model_name: "Qwen/Qwen3-Embedding-0.6B"
  precomputed_embeddings_path: "${EMBEDDINGS_PATH}"

model:
  num_layers: 6
  num_heads: 8
  ff_dim: 2048
  dropout: 0.1
  max_seq_length: 512
  num_labels: 2
  head_type: "logistic"
  head_hidden_size: 256

wandb:
  enabled: false
  project: "MIMIC-IV-baselines"
  run_name: "baseline-text-embedding-transformer-mimic"

training:
  output_dir: "${PROJECTDIR}/TextCancEHR2/experiments/Results/mimic-baselines/text_embedding_transformer"
  overwrite_output_dir: true
  epochs: 10
  batch_size: 512
  learning_rate: 1e-4
  weight_decay: 0.01
  dataloader_num_workers: 2

data:
  data_dir: "${HOME}/MIMIC-IV_tokenisation"
  vocab_filepath: "${HOME}/MIMIC-IV_tokenisation/vocab.csv"
  aces_label_dir: "${HOME}/MIMIC_data/labels/hospital_readmission"
  lookup_dir: "${HOME}/MIMIC_data/hosp"
  dataset: "MIMIC"
  task: "prediction"
  label_column: "label"
