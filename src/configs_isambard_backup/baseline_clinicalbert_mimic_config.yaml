# src/configs_isambard/baseline_clinicalbert_mimic_config.yaml
# Template: ${HOME} and ${PROJECTDIR} are expanded at runtime by envsubst.

name: "clinicalbert_baseline_mimic"

model:
  model_name: "emilyalsentzer/Bio_ClinicalBERT"
  num_labels: 2
  max_length: 512

wandb:
  enabled: true
  project: "MIMIC-IV-baselines"
  run_name: "baseline-clinicalbert-mimic"

training:
  output_dir: "${PROJECTDIR}/TextCancEHR2/experiments/Results/mimic-baselines/clinicalbert"
  overwrite_output_dir: true
  device: "cuda"
  require_cuda: false
  epochs: 1
  batch_size: 32
  eval_batch_size: 32
  learning_rate: 2e-5
  weight_decay: 0.01
  warmup_steps: 100
  gradient_accumulation_steps: 1
  fp16: false
  bf16: false
  logging_steps: 50
  eval_steps: 250
  save_steps: 500
  save_total_limit: 2
  dataloader_num_workers: 4

data:
  data_dir: "${HOME}/MIMIC-IV_tokenisation"
  vocab_filepath: "${HOME}/MIMIC-IV_tokenisation/vocab.csv"
  aces_label_dir: "${HOME}/MIMIC_data/labels/icu_mortality"
  lookup_dir: "${HOME}/MIMIC_data/hosp"
  dataset: "MIMIC"
  task: "prediction"
  label_column: "label"
  max_length: 512
