# src/configs_isambard/baseline_pure_llm_mimic_config.yaml
# Template: ${HOME} and ${PROJECTDIR} are expanded at runtime by envsubst.

name: "pure_llm_baseline_mimic"

debug:
  enabled: false
  print_first_n: 5

model:
  model_name: "unsloth/mistral-7b-instruct-v0.3-bnb-4bit"
  max_length: 12000
  load_in_4bit: true

inference:
  batch_size: 2
  logit_low_threshold: -10.0

output_dir: "${PROJECTDIR}/TextCancEHR2/experiments/Results/mimic-baselines/pure_llm_mimic"
overwrite_output_dir: true

prompt:
  filepath: "src/resources/icu_mortality_prompt.txt"

data:
  data_dir: "${HOME}/MIMIC-IV_tokenisation"
  vocab_filepath: "${HOME}/MIMIC-IV_tokenisation/vocab.csv"
  aces_label_dir: "${HOME}/MIMIC_data/labels/icu_mortality"
  lookup_dir: "${HOME}/MIMIC_data/hosp"
  dataset: "MIMIC"
  task: "prediction"
  format: "text"
