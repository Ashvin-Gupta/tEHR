# src/configs_isambard/mimic_sft_classifier.yaml
# Template: ${HOME} and ${PROJECTDIR} are expanded at runtime by envsubst.

name: "sft_llm_classifier_mimic"

task:
  description: "Predict whether the patient will die in the ICU"

model:
  model_name: "unsloth/mistral-7b-instruct-v0.3-bnb-4bit"
  pretrained_checkpoint: null
  max_length: 8192
  load_in_4bit: true
  logit_low_threshold: -10.0

lora:
  r: 16
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  lora_alpha: 32
  lora_dropout: 0.05

prompt:
  filepath: "src/resources/sft_classifier_prompt.txt"

wandb:
  enabled: true
  project: "MIMIC-IV-classification"
  run_name: "mimic-sft-classifier-mistral"

training:
  output_dir: "${PROJECTDIR}/TextCancEHR2/experiments/Results/mimic-sft-classification"
  epochs: 1
  batch_size: 4
  eval_batch_size: 4
  learning_rate: 2e-5
  weight_decay: 0.01
  warmup_steps: 100
  gradient_accumulation_steps: 2
  fp16: false
  bf16: true
  logging_steps: 10
  eval_steps: 200
  save_steps: 200
  save_total_limit: 2
  dataloader_num_workers: 0

data:
  data_dir: "${HOME}/MIMIC-IV_tokenisation"
  vocab_filepath: "${HOME}/MIMIC-IV_tokenisation/vocab.csv"
  aces_label_dir: "${HOME}/MIMIC_data/labels/icu_mortality"
  lookup_dir: "${HOME}/MIMIC_data/hosp"
  dataset: "MIMIC"
  task: "prediction"
