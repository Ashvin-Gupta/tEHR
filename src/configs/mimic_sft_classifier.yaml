name: "sft_llm_classifier_mimic"

# ------------------------------------------------------------------
# Task description — REQUIRED: set this explicitly before running.
# Examples: "die in the ICU", "be readmitted to hospital"
# ------------------------------------------------------------------
task:
  description: "REQUIRED: set this to e.g. 'die in the ICU' or 'be readmitted to hospital'"

model:
  # Base instruct model (or path to a domain-pretrained checkpoint).
  # If pretrained_checkpoint is set, that checkpoint is loaded instead of model_name.
  model_name: "unsloth/mistral-7b-instruct-v0.3-bnb-4bit"
  pretrained_checkpoint: null   # e.g. "/home/ag619/experiments/Results/Pretrain-Mistral-7B-Mimic/checkpoint-14000"
  max_length: 8192
  load_in_4bit: true
  # Probability defaults to 0.5 when max(logit_0, logit_1) < this value.
  logit_low_threshold: -10.0

lora:
  r: 16
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  lora_alpha: 32
  lora_dropout: 0.05

prompt:
  filepath: "src/resources/sft_classifier_prompt.txt"

wandb:
  enabled: true
  project: "MIMIC-IV-classification"
  run_name: "mimic-sft-classifier-mistral"

training:
  output_dir: "/home/ag619/experiments/Results/mimic-sft-classification"
  epochs: 1
  batch_size: 4
  eval_batch_size: 4
  learning_rate: 2e-5
  weight_decay: 0.01
  warmup_steps: 100
  gradient_accumulation_steps: 2
  fp16: false
  bf16: true
  logging_steps: 10
  eval_steps: 200
  save_steps: 200
  save_total_limit: 2
  dataloader_num_workers: 0

data:
  data_dir: "/home/ag619/MIMIC-IV tokensiation"
  vocab_filepath: "/home/ag619/MIMIC-IV tokensiation/vocab.csv"
  aces_label_dir: "/home/ag619/MIMIC_data/labels/icu_mortality"
  lookup_dir: "/home/ag619/MIMIC_data/hosp"
  dataset: "MIMIC"
  task: "prediction"
