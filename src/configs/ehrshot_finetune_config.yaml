name: "ehrshot_classifier_finetune"

model:
  # Path to LoRA-adapted checkpoint from pretraining.
  pretrained_checkpoint: "/gpfs/scratch/qc25022/pancreas/experiments/Pretrain-Mistral-7B-Pancreas-new-time/checkpoint-6000"  # EDIT ME
  max_length: 12000
  hidden_size: 4096
  num_labels: 2
  freeze_llm: true
  train_lora: true

  # Classification head architecture
  head_type: "linear"
  head_hidden_size: 512
  head_dropout: 0.1

wandb:
  enabled: true
  project: "EHRSHOT-classification"
  run_name: "ehrshot-lora-linear-finetune"  # EDIT ME

training:
  output_dir: "/gpfs/scratch/qc25022/pancreas/experiments/Results/ehrshot-pancreas-classification-finetune"  # EDIT ME
  overwrite_output_dir: false
  epochs: 1
  batch_size: 2
  eval_batch_size: 2
  learning_rate: 1e-6
  weight_decay: 0.01
  warmup_steps: 100
  gradient_accumulation_steps: 2
  fp16: false
  bf16: true
  logging_steps: 50
  eval_steps: 100
  save_steps: 500
  save_total_limit: 2
  load_in_4bit: true
  multi_label: false
  save_model: false
  dataloader_num_workers: 0

data:
  dataset: "EHRSHOT"
  csv_filepath: "/data/home/qc25022/TextCancEHR2/src/resources/new_pancan_formatted.csv"  # EDIT ME
  # Uses EHRSHOT CSV split column:
  #   train -> supervised training
  #   val   -> trainer eval split during training
  #   test  -> held-out split
  # At final evaluation, metrics are computed on val+test together.
  combine_eval_splits: true
