name: "llm_classifier"
# /data/scratch/qc25022/pancreas/experiments/Pretrain-Qwen3-8B-Pancreas-new-time/checkpoint-11000
# /data/scratch/qc25022/pancreas/experiments/Pretrain-Mistral-7B-Pancreas-new-time/checkpoint-6000
model:
  pretrained_checkpoint: "/home/ag619/Pretrain-Mistral-7B-Mimic/checkpoint-4000"
  max_length: 12000
  hidden_size: 4096
  num_labels: 2
  freeze_llm: true            # Keep base model frozen, only LoRA + classifier train
  train_lora: true            # Re-enable LoRA adapter parameters for training
  
  # Classification head architecture
  head_type: "linear"         # Options: "linear", "mlp", "deep_mlp"
  head_hidden_size: 512       # Hidden layer size for MLP heads (ignored for linear)
  head_dropout: 0.1           # Dropout rate for MLP heads (ignored for linear)

wandb:
  enabled: true
  project: "MIMIC-IV-classification"
  run_name: "mimic-ICU-mortality-classification-mistral"

training:
  output_dir: "/home/ag619/experiments/Results/mimic-ICU-mortality-classification"
  overwrite_output_dir: false
  epochs: 1
  batch_size: 8
  eval_batch_size: 8
  learning_rate: 1e-6
  weight_decay: 0.01
  warmup_steps: 100
  gradient_accumulation_steps: 2
  fp16: false
  bf16: true
  logging_steps: 10
  eval_steps: 50
  save_steps: 500
  save_total_limit: 2
  load_in_4bit: true
  multi_label: false
  save_model: false
  # early_stopping_patience: 5
  # early_stopping_threshold: 0.001
  dataloader_num_workers: 0


data:
  data_dir: "/home/ag619/MIMIC-IV tokensiation"
  vocab_filepath: "/home/ag619/MIMIC-IV tokensiation/vocab.csv"
  aces_label_dir: "/home/ag619/MIMIC_data/labels/icu_mortality"
  lookup_dir: "/home/ag619/MIMIC_data/hosp"
  dataset: "MIMIC"
  max_length: 12000
  handle_long_sequences: "warn"
  sort_by_length: true
