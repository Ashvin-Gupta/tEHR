name: "frozen_llm_linear_baseline"

model:
  model_name: "unsloth/mistral-7b-v0.3-bnb-4bit"
  max_length: 12000
  hidden_size: 4096
  num_labels: 2
  head_type: "linear"
  head_hidden_size: 512
  head_dropout: 0.1

wandb:
  enabled: true
  project: "Pretrain-Qwen3-8B-Pancreas-classification"
  run_name: "baseline-frozen-llm-linear-mistral-7B-12months"

training:
  output_dir: "/gpfs/scratch/qc25022/pancreas/experiments/Results/Baselines/frozen_llm_linear_mistral-7B-12months"
  overwrite_output_dir: true
  epochs: 1
  batch_size: 4
  eval_batch_size: 4
  learning_rate: 1e-5
  weight_decay: 0.01
  warmup_steps: 100
  gradient_accumulation_steps: 1
  fp16: false
  bf16: true
  logging_steps: 50
  eval_steps: 250
  save_steps: 500
  save_total_limit: 2
  load_in_4bit: true
  multi_label: false
  dataloader_num_workers: 2

data:
  cutoff_months: 12
  data_dir: "/gpfs/scratch/qc25022/pancreas/tokenised_data_pancreas_MEDS_new_time/cprd_upgi"
  vocab_filepath: "/gpfs/scratch/qc25022/pancreas/tokenised_data_pancreas_MEDS_new_time/cprd_upgi/vocab.csv"
  labels_filepath: "/data/home/qc25022/cancer-extraction-pipeline/output/pancreas_MEDS/subject_information.csv"
  medical_lookup_filepath: "/data/home/qc25022/TextCancEHR2/src/resources/MedicalDictTranslation2.csv"
  lab_lookup_filepath: "/data/home/qc25022/TextCancEHR2/src/resources/LabLookUP.csv"
  region_lookup_filepath: "/data/home/qc25022/TextCancEHR2/src/resources/RegionLookUp.csv"
  time_lookup_filepath: "/data/home/qc25022/TextCancEHR2/src/resources/TimeLookUp.csv"  
  dataset: "CPRD"


