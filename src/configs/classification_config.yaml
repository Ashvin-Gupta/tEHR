name: "llm_classifier"
# /data/scratch/qc25022/pancreas/experiments/Pretrain-Qwen3-8B-Pancreas-new-time/checkpoint-11000
# /data/scratch/qc25022/pancreas/experiments/Pretrain-Mistral-7B-Pancreas-new-time/checkpoint-6000
model:
  pretrained_checkpoint: "/data/private/ag619/experiments/Results/Pretrain-Qwen3-0.6B-Pancreas-debug/final_model"
  max_length: 12000
  hidden_size: 4096
  num_labels: 2
  freeze_llm: true            # Keep base model frozen, only LoRA + classifier train
  train_lora: true            # Re-enable LoRA adapter parameters for training
  
  # Classification head architecture
  head_type: "linear"         # Options: "linear", "mlp", "deep_mlp"
  head_hidden_size: 512       # Hidden layer size for MLP heads (ignored for linear)
  head_dropout: 0.1           # Dropout rate for MLP heads (ignored for linear)

wandb:
  enabled: true
  project: "Pretrain-Qwen3-8B-Pancreas-classification"
  run_name: "lora-12-month-qwen3-0.6B"

training:
  output_dir: "/gpfs/scratch/qc25022/pancreas/experiments/Results/lora-6-month-logistic-refactored-new-time-qwen3-0.6B"
  overwrite_output_dir: true
  epochs: 1
  batch_size: 8
  eval_batch_size: 8
  learning_rate: 1e-6
  weight_decay: 0.01
  warmup_steps: 100
  gradient_accumulation_steps: 2
  fp16: false
  bf16: true
  logging_steps: 50
  eval_steps: 250
  save_steps: 500
  save_total_limit: 2
  load_in_4bit: true
  multi_label: false
  save_model: false
  # early_stopping_patience: 5
  # early_stopping_threshold: 0.001
  dataloader_num_workers: 0


data:
  cutoff_months: 12  # Remove last 5 month before diagnosis for cancer patients
  data_dir: "/gpfs/scratch/qc25022/pancreas/tokenised_data_pancreas_MEDS_new_time/cprd_upgi"
  vocab_filepath: "/gpfs/scratch/qc25022/pancreas/tokenised_data_pancreas_MEDS_new_time/cprd_upgi/vocab.csv"
  labels_filepath: "/data/home/qc25022/cancer-extraction-pipeline/output/pancreas_MEDS/subject_information.csv"
  medical_lookup_filepath: "/data/home/qc25022/TextCancEHR2/src/resources/MedicalDictTranslation2.csv"
  lab_lookup_filepath: "/data/home/qc25022/TextCancEHR2/src/resources/LabLookUP.csv"
  region_lookup_filepath: "/data/home/qc25022/TextCancEHR2/src/resources/RegionLookUp.csv"
  time_lookup_filepath: "/data/home/qc25022/TextCancEHR2/src/resources/TimeLookUp.csv"
  dataset: "CPRD"
