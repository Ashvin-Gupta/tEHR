# Shared reproducibility defaults for all MIMIC experiments.
# Merged first by build_mimic_config; experiment YAMLs can override.
#
# seed: fixed RNG seed for python / numpy / torch / HF
# training.resume_from_last: if true, auto-resume from newest checkpoint-*
#   under training.output_dir (or training.output_dir/checkpoints)
# CLI: --resume_from_last / --no-resume_from_last
#   (or RESUME_FROM_LAST=true|false with sbatch run.sh)

seed: 42

training:
  seed: 42
  resume_from_last: true
