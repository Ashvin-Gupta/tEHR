# Isambard (Bristol) path remaps applied by:
#   python -m src.training.config_utils build --site isambard ...
#
# Experiment / model / task YAMLs stay shared with the ag619 layout;
# only filesystem roots change. Longer ``from`` prefixes are applied first.

_site:
  name: isambard
  labels_cache_root: "/projects/u6ps/TextCancEHR2/experiments/labels_cache"
  path_rewrite:
    # Tokenisation spelling differs (_ vs -)
    - from: "/home/ag619/MIMIC-IV-tokenisation"
      to: "/home/u6ps/ashvingupta812.u6ps/MIMIC-IV_tokenisation"
    - from: "/home/ag619/MIMIC_data"
      to: "/home/u6ps/ashvingupta812.u6ps/MIMIC_data"
    # Copied good pretrained adapter lives under $HOME on Isambard
    - from: "/home/ag619/experiments/Results/Pretrain-Mistral-7B-Mimic"
      to: "/home/u6ps/ashvingupta812.u6ps/Pretrain-Mistral-7B-Mimic"
    - from: "/home/ag619/experiments/Results/Pretrain-MedGemma-4B-Mimic"
      to: "/projects/u6ps/TextCancEHR2/experiments/Results/Pretrain-MedGemma-4B-Mimic"
    - from: "/home/ag619/experiments/Results"
      to: "/projects/u6ps/TextCancEHR2/experiments/Results"
    - from: "/home/ag619/experiments/labels_cache"
      to: "/projects/u6ps/TextCancEHR2/experiments/labels_cache"

# Unsloth discards attention_mask in train mode but builds a dense 4D mask
# in eval. At max_length=12000 that spikes VRAM vs the other cluster
# (FlashAttn/xformers + shorter early length-sorted train batches).
training:
  eval_batch_size: 1
