name: "pure_llm_baseline"

# Debug: set debug.enabled to true to save full raw outputs when extraction fails.
# Outputs go to {output_dir}/debug_failed_extractions/failed_extractions.txt
# print_first_n: print first N failures to stdout (0 = only short warning)
debug:
  enabled: false
  print_first_n: 5

# IMPORTANT: Use an *Instruct* model (e.g. Qwen3-8B-Instruct) for zero-shot prompting.
# Base models are not instruction-tuned and often produce garbled output.
model:
  model_name: "unsloth/mistral-7b-v0.3-bnb-4bit"
  max_length: 16000
  load_in_4bit: true

inference:
  batch_size: 4

output_dir: "/gpfs/scratch/qc25022/pancreas/experiments/Results/baselines/pure_llm-3months"
overwrite_output_dir: true

prompt:
  filepath: "src/resources/pancreatic_cancer_prompt.txt"

data:
  cutoff_months: 3
  data_dir: '/gpfs/scratch/qc25022/pancreas/tokenised_data_pancreas_MEDS_new_time/cprd_upgi'
  vocab_filepath: "/gpfs/scratch/qc25022/pancreas/tokenised_data_pancreas_MEDS_new_time/cprd_upgi/vocab.csv"
  labels_filepath: "/data/home/qc25022/TextCancEHR2/src/resources/subject_information.csv"
  medical_lookup_filepath: "/data/home/qc25022/TextCancEHR2/src/resources/MedicalDictTranslation2.csv"
  lab_lookup_filepath: "/data/home/qc25022/TextCancEHR2/src/resources/LabLookUP.csv"
  region_lookup_filepath: "/data/home/qc25022/TextCancEHR2/src/resources/RegionLookUp.csv"
  time_lookup_filepath: "/data/home/qc25022/TextCancEHR2/src/resources/TimeLookUp.csv"
  dataset: "CPRD"

