name: "pure_llm_baseline"

# Debug: set debug.enabled to true to save full raw outputs when extraction fails.
# Outputs go to {output_dir}/debug_failed_extractions/failed_extractions.txt
# print_first_n: print first N failures to stdout (0 = only short warning)
debug:
  enabled: false
  print_first_n: 5

# IMPORTANT: Use an *Instruct* model (e.g. Qwen3-8B-Instruct) for zero-shot prompting.
# Base models are not instruction-tuned and often produce garbled output.
model:
  model_name: "unsloth/Qwen3-0.6B-Base-unsloth-bnb-4bit"
  max_length: 16000
  load_in_4bit: true

inference:
  batch_size: 4

output_dir: "/data/private/ag619/experiments/Results/MIMIC/pure_llm"
overwrite_output_dir: true

prompt:
  filepath: "src/resources/icu_mortality_prompt.txt"

data:
  cutoff_months: 6
  data_dir: "/data/private/ag619/MIMIC-IV tokensiation"
  vocab_filepath: "/data/private/ag619/MIMIC-IV tokensiation/vocab.csv"
  aces_label_dir: "/data/private/ag619/labels/icu_mortality"
  lookup_dir: "/data/private/ag619/hosp"
  dataset: "MIMIC"
  task: "prediction"

