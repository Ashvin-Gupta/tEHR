name: "qwen_llm_linear_baseline"

# Single-stage supervised learning: base Qwen LLM + fresh LoRA + linear head.
# No pretraining checkpoint required.

model:
  model_name: "unsloth/Qwen3-8B-Base-unsloth-bnb-4bit"
  max_length: 8192
  hidden_size: 4096
  num_labels: 2
  head_type: "linear"
  head_hidden_size: 512   # unused for linear head
  head_dropout: 0.1       # unused for linear head

lora:
  r: 16
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  use_rslora: true

wandb:
  enabled: true
  project: "Qwen3-8B-Pancreas-classification"
  run_name: "qwen-llm-linear-single-stage"

training:
  output_dir: "/gpfs/scratch/qc25022/pancreas/experiments/Results/CPRD/qwen_llm_linear"
  overwrite_output_dir: true
  epochs: 1
  batch_size: 2
  eval_batch_size: 2
  learning_rate: 1e-4
  weight_decay: 0.01
  warmup_steps: 100
  gradient_accumulation_steps: 1
  fp16: false
  bf16: true
  logging_steps: 50
  eval_steps: 250
  save_steps: 500
  save_total_limit: 2
  load_in_4bit: true
  multi_label: false
  save_model: false
  gradient_checkpointing: "unsloth"
  dataloader_num_workers: 0

data:
  cutoff_months: 6
  data_dir: "/gpfs/scratch/qc25022/pancreas/tokenised_data_pancreas_MEDS_new_time/cprd_upgi"
  vocab_filepath: "/gpfs/scratch/qc25022/pancreas/tokenised_data_pancreas_MEDS_new_time/cprd_upgi/vocab.csv"
  labels_filepath: "/data/home/qc25022/cancer-extraction-pipeline/output/pancreas_MEDS/subject_information.csv"
  medical_lookup_filepath: "/data/home/qc25022/TextCancEHR2/src/resources/MedicalDictTranslation2.csv"
  lab_lookup_filepath: "/data/home/qc25022/TextCancEHR2/src/resources/LabLookUP.csv"
  region_lookup_filepath: "/data/home/qc25022/TextCancEHR2/src/resources/RegionLookUp.csv"
  time_lookup_filepath: "/data/home/qc25022/TextCancEHR2/src/resources/TimeLookUp.csv"
  sort_by_length: true
  dataset: "CPRD"
