name: "encoder_transformer_hparam_search"

model:
  max_seq_length: 512
  ff_dim: 2048
  dropout: 0.1
  num_labels: 2
  max_vocab_tokens: 5000

training:
  output_dir: "/data/private/ag619/experiments/Results/CPRD/encoder_transformer_hparam_search"
  epochs: 30
  batch_size: 32
  learning_rate: 1e-4
  weight_decay: 0.01
  dataloader_num_workers: 2
  early_stopping_patience: 4
  early_stopping_min_delta: 0.0005
  seed: 42

pretrain:
  enabled: true
  epochs: 20
  batch_size: 64
  learning_rate: 1e-4
  weight_decay: 0.01
  early_stopping_patience: 3
  early_stopping_min_delta: 0.0005

hyperparameter_search:
  selection_metric: "auroc"
  hidden_dims: [256, 512]
  num_layers_values: [4, 6, 8]
  num_heads_values: [4, 8]
  mlm_probabilities: [0.15, 0.20, 0.25]

data:
  cutoff_months: 1
  data_dir: "/data/private/ag619/CPRD_tokenisation"
  vocab_filepath: "/data/private/ag619/CPRD_tokenisation/vocab.csv"
  labels_filepath: "/home/ag619/TextCancEHR2/src/resources/subject_information.csv"
  medical_lookup_filepath: "/home/ag619/TextCancEHR2/src/resources/MedicalDictTranslation2.csv"
  lab_lookup_filepath: "/home/ag619/TextCancEHR2/src/resources/LabLookUP.csv"
  region_lookup_filepath: "/home/ag619/TextCancEHR2/src/resources/RegionLookUp.csv"
  time_lookup_filepath: "/home/ag619/TextCancEHR2/src/resources/TimeLookUp.csv"
  dataset: "CPRD"
