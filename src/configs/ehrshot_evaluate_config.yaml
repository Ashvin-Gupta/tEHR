name: "ehrshot_evaluation"

# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------
# Point pretrained_checkpoint at the directory that holds the LoRA-adapted
# base LLM (adapter_config.json + adapter_model.safetensors).
# The classifier head weights are loaded separately from model_checkpoint
# (passed on the command line).
model:
  pretrained_checkpoint: "/data/private/ag619/experiments/Pretrain-Mistral-7B-Mimic/checkpoint-4000"  # EDIT ME
  max_length: 4096
  hidden_size: 4096        # Must match the hidden size of your base LLM
  num_labels: 2
  head_type: "linear"
  head_hidden_size: 512
  head_dropout: 0.1

# ---------------------------------------------------------------------------
# Training (only the fields used during evaluation)
# ---------------------------------------------------------------------------
training:
  output_dir: "/data/private/ag619/experiments/Results/ehrshot-ICU-mortality-classification"  # EDIT ME
  eval_batch_size: 4
  fp16: false
  bf16: true
  load_in_4bit: true
  multi_label: false
  dataloader_num_workers: 4

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  dataset: "EHRSHOT"
  csv_filepath: "/home/ag619/EHRSHOT_massaging/new_pancan_formatted.csv"  # EDIT ME if needed
  max_length: 4096
  # Load every row in the CSV as a single external test set (no train/val split).
  external_validation: true
