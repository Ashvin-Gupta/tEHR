name: "llm_classifier_ablation_frozen_pretrained"
# Ablation 5b: Pretrained Mistral (EHR checkpoint); frozen LLM; mean-pool; train head only.
# Isolates the contribution of LoRA fine-tuning in Exp 1.

model:
  pretrained_checkpoint: "/home/ag619/experiments/Results/Pretrain-Mistral-7B-Mimic/checkpoint-14000"
  max_length: 12000
  hidden_size: 4096
  num_labels: 2
  freeze_llm: true
  train_lora: false                 # Freeze LoRA — head only
  pooling: "mean"                   # Mean-pool to match Exp 1 setup
  use_unsloth: true

  head_type: "linear"
  head_hidden_size: 512
  head_dropout: 0.1

wandb:
  enabled: true
  project: "MIMIC-IV-classification"
  run_name: "mimic-ablation-frozen-pretrained-mistral"

training:
  output_dir: "/home/ag619/experiments/Results/mimic-ablation-frozen-pretrained-mistral"
  overwrite_output_dir: true
  epochs: 1
  batch_size: 8
  eval_batch_size: 8
  learning_rate: 1e-4
  weight_decay: 0.01
  warmup_steps: 100
  gradient_accumulation_steps: 2
  fp16: false
  bf16: true
  logging_steps: 10
  eval_steps: 50
  save_steps: 200
  save_total_limit: 2
  load_in_4bit: true
  multi_label: false
  save_model: false
  dataloader_num_workers: 0

data:
  data_dir: "/home/ag619/MIMIC-IV-tokenisation"
  vocab_filepath: "/home/ag619/MIMIC-IV-tokenisation/vocab.csv"
  aces_label_dir: "/home/ag619/MIMIC_data/labels/icu_mortality"
  lookup_dir: "/home/ag619/MIMIC_data/hosp"
  dataset: "MIMIC"
  task: "prediction"
  sort_by_length: true
