name: "llm_pretrain_medgemma"
# Stage 1 of Exp 1 (MedGemma): continued pretraining of MedGemma 1.5 4B IT
# on MIMIC-IV EHR text via causal LM objective + LoRA.

model:
  model_name: "google/medgemma-1.5-4b-it"
  max_length: 8192
  use_unsloth: false                # MedGemma uses HF + BitsAndBytes backend
  hf_token: null                    # Set HF_TOKEN env var or fill in if required

wandb:
  enabled: true
  project: "Pretrain-MIMIC"
  run_name: "Pretrain-MedGemma-4B-Mimic"

lora:
  r: 16
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"

training:
  output_dir: "/home/ag619/experiments/Results/Pretrain-MedGemma-4B-Mimic"
  overwrite_output_dir: true
  load_in_4bit: true

  epochs: 1
  batch_size: 4
  eval_batch_size: 4
  learning_rate: 1e-5
  weight_decay: 0.05
  warmup_steps: 500

  gradient_accumulation_steps: 4
  gradient_checkpointing: true

  fp16: false
  bf16: true

  logging_steps: 10
  eval_steps: 500
  save_steps: 1000
  save_total_limit: 3
  dataloader_num_workers: 4

data:
  data_dir: "/home/ag619/MIMIC-IV-tokenisation"
  vocab_filepath: "/home/ag619/MIMIC-IV-tokenisation/vocab.csv"
  aces_label_dir: "/home/ag619/MIMIC_data/labels/icu_mortality"
  lookup_dir: "/home/ag619/MIMIC_data/hosp"
  dataset: "MIMIC"
  task: "pretrain"
