name: "llm_classifier_ablation_no_pretrain_lora"
# Ablation 5a: No pretraining; fresh Mistral base model + LoRA + mean-pool head.
# Isolates the contribution of the EHR pretraining stage in Exp 1.

model:
  model_name: "unsloth/mistral-7b-v0.3-bnb-4bit"
  pretrained_checkpoint: null       # No pretrain — load fresh base model
  max_length: 12000
  hidden_size: 4096
  num_labels: 2
  freeze_llm: true
  train_lora: true                  # Train LoRA adapters (same as Exp 1)
  pooling: "mean"                   # Mean-pool instead of last-token
  use_unsloth: true

  head_type: "linear"
  head_hidden_size: 512
  head_dropout: 0.1

lora:
  r: 16
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  use_rslora: true

wandb:
  enabled: true
  project: "MIMIC-IV-classification"
  run_name: "mimic-ablation-no-pretrain-lora-mistral"

training:
  output_dir: "/home/ag619/experiments/Results/mimic-ablation-no-pretrain-lora-mistral"
  overwrite_output_dir: true
  epochs: 1
  batch_size: 8
  eval_batch_size: 8
  learning_rate: 1e-5
  weight_decay: 0.01
  warmup_steps: 100
  gradient_accumulation_steps: 2
  fp16: false
  bf16: true
  logging_steps: 10
  eval_steps: 50
  save_steps: 200
  save_total_limit: 2
  load_in_4bit: true
  multi_label: false
  save_model: false
  dataloader_num_workers: 0

data:
  data_dir: "/home/ag619/MIMIC-IV-tokenisation"
  vocab_filepath: "/home/ag619/MIMIC-IV-tokenisation/vocab.csv"
  aces_label_dir: "/home/ag619/MIMIC_data/labels/icu_mortality"
  lookup_dir: "/home/ag619/MIMIC_data/hosp"
  dataset: "MIMIC"
  task: "prediction"
  sort_by_length: true
