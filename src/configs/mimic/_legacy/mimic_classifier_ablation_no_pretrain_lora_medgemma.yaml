name: "llm_classifier_ablation_no_pretrain_lora_medgemma"
# Ablation 5a (MedGemma): No pretraining; fresh MedGemma + LoRA + mean-pool head.

model:
  model_name: "google/medgemma-1.5-4b-it"
  pretrained_checkpoint: null
  max_length: 12000
  hidden_size: 2560                 # Gemma 3 4B hidden dimension
  num_labels: 2
  freeze_llm: true
  train_lora: true
  pooling: "mean"
  use_unsloth: false

  head_type: "linear"
  head_hidden_size: 512
  head_dropout: 0.1

lora:
  r: 16
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"

wandb:
  enabled: true
  project: "MIMIC-IV-classification"
  run_name: "mimic-ablation-no-pretrain-lora-medgemma"

training:
  output_dir: "/home/ag619/experiments/Results/mimic-ablation-no-pretrain-lora-medgemma"
  overwrite_output_dir: true
  epochs: 1
  batch_size: 8
  eval_batch_size: 8
  learning_rate: 1e-5
  weight_decay: 0.01
  warmup_steps: 100
  gradient_accumulation_steps: 2
  fp16: false
  bf16: true
  logging_steps: 10
  eval_steps: 50
  save_steps: 200
  save_total_limit: 2
  load_in_4bit: true
  multi_label: false
  save_model: false
  dataloader_num_workers: 0

data:
  data_dir: "/home/ag619/MIMIC-IV-tokenisation"
  vocab_filepath: "/home/ag619/MIMIC-IV-tokenisation/vocab.csv"
  aces_label_dir: "/home/ag619/MIMIC_data/labels/icu_mortality"
  lookup_dir: "/home/ag619/MIMIC_data/hosp"
  dataset: "MIMIC"
  task: "prediction"
  sort_by_length: true
