name: "llm_classifier_medgemma"
# Exp 1 (MedGemma): load EHR-pretrained MedGemma checkpoint, then supervised
# fine-tune with LoRA + linear classification head (ICU mortality).
# Run mimic_pretrain_medgemma.yaml first and set pretrained_checkpoint below.

model:
  pretrained_checkpoint: "/home/ag619/experiments/Results/Pretrain-MedGemma-4B-Mimic/checkpoint-XXXX"
  max_length: 12000
  hidden_size: 2560                 # Gemma 3 4B hidden dimension
  num_labels: 2
  freeze_llm: true
  train_lora: true
  pooling: "last_token"
  use_unsloth: false                # MedGemma uses HF + BitsAndBytes backend

  head_type: "linear"
  head_hidden_size: 512
  head_dropout: 0.1

lora:
  r: 16
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"

wandb:
  enabled: true
  project: "MIMIC-IV-classification"
  run_name: "mimic-icu-mortality-classification-medgemma"

training:
  output_dir: "/home/ag619/experiments/Results/mimic-icu-mortality-classification-medgemma"
  overwrite_output_dir: true
  epochs: 1
  batch_size: 8
  eval_batch_size: 8
  learning_rate: 1e-6
  weight_decay: 0.01
  warmup_steps: 100
  gradient_accumulation_steps: 2
  fp16: false
  bf16: true
  logging_steps: 10
  eval_steps: 50
  save_steps: 200
  save_total_limit: 2
  load_in_4bit: true
  multi_label: false
  save_model: false
  dataloader_num_workers: 0

data:
  data_dir: "/home/ag619/MIMIC-IV-tokenisation"
  vocab_filepath: "/home/ag619/MIMIC-IV-tokenisation/vocab.csv"
  aces_label_dir: "/home/ag619/MIMIC_data/labels/icu_mortality"
  lookup_dir: "/home/ag619/MIMIC_data/hosp"
  dataset: "MIMIC"
  task: "prediction"
  sort_by_length: true
