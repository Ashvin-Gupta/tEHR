name: "llm_classifier_ablation_frozen_pretrained_medgemma"
# Ablation 5b (MedGemma): Pretrained MedGemma frozen; mean-pool; head only.
# Run mimic_pretrain_medgemma.yaml first and update pretrained_checkpoint.

model:
  pretrained_checkpoint: "/home/ag619/experiments/Results/Pretrain-MedGemma-4B-Mimic/checkpoint-XXXX"
  max_length: 12000
  hidden_size: 2560
  num_labels: 2
  freeze_llm: true
  train_lora: false
  pooling: "mean"
  use_unsloth: false

  head_type: "linear"
  head_hidden_size: 512
  head_dropout: 0.1

wandb:
  enabled: true
  project: "MIMIC-IV-classification"
  run_name: "mimic-ablation-frozen-pretrained-medgemma"

training:
  output_dir: "/home/ag619/experiments/Results/mimic-ablation-frozen-pretrained-medgemma"
  overwrite_output_dir: true
  epochs: 1
  batch_size: 8
  eval_batch_size: 8
  learning_rate: 1e-4
  weight_decay: 0.01
  warmup_steps: 100
  gradient_accumulation_steps: 2
  fp16: false
  bf16: true
  logging_steps: 10
  eval_steps: 50
  save_steps: 200
  save_total_limit: 2
  load_in_4bit: true
  multi_label: false
  save_model: false
  dataloader_num_workers: 0

data:
  data_dir: "/home/ag619/MIMIC-IV-tokenisation"
  vocab_filepath: "/home/ag619/MIMIC-IV-tokenisation/vocab.csv"
  aces_label_dir: "/home/ag619/MIMIC_data/labels/icu_mortality"
  lookup_dir: "/home/ag619/MIMIC_data/hosp"
  dataset: "MIMIC"
  task: "prediction"
  sort_by_length: true
