# Lexical ablation: permute real clinical titles across codes (within category).
# Looks like clinical English but with wrong meanings. Same setup as 5a.
#
# Usage:
#   sbatch src/submissions/mimic/run.sh surface_scramble_shuffle mistral icu_mortality

extends:
  - ../shared/mimic_data.yaml
  - ../shared/lora.yaml
  - ../shared/training_classifier.yaml

name: "mimic_surface_scramble_shuffle_{model}_{task}"

wandb:
  run_name: "surface-scramble-shuffle-{model}-{task}"

data:
  surface_form: scramble_shuffle
  scramble_seed: 42

model:
  pretrained_checkpoint: null
  num_labels: 2
  freeze_llm: true
  train_lora: true
  pooling: "mean"
  head_type: "linear"
  head_hidden_size: 512
  head_dropout: 0.1

training:
  output_dir: "/home/ag619/experiments/Results/mimic-surface-scramble-shuffle-{model}-{task}"
  learning_rate: 1e-5
