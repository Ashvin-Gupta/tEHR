# Lexical ablation: raw EHR token strings instead of clinical titles.
# Uses the same adaptation setup as 5a (no EHR CPT; fresh LLM + LoRA + head)
# so the comparison isolates surface form, not continued pretraining.
#
# Usage:
#   sbatch src/submissions/mimic/run.sh surface_raw mistral icu_mortality
#   sbatch src/submissions/isambard/run.sh surface_raw mistral hospital_mortality
#
# Fair text control for this ablation: ablation_no_pretrain_lora (same setup, surface=text).

extends:
  - ../shared/mimic_data.yaml
  - ../shared/lora.yaml
  - ../shared/training_classifier.yaml

name: "mimic_surface_raw_{model}_{task}"

wandb:
  run_name: "surface-raw-{model}-{task}"

data:
  surface_form: raw
  scramble_seed: 42

model:
  pretrained_checkpoint: null
  num_labels: 2
  freeze_llm: true
  train_lora: true
  pooling: "mean"
  head_type: "linear"
  head_hidden_size: 512
  head_dropout: 0.1

training:
  output_dir: "/home/ag619/experiments/Results/mimic-surface-raw-{model}-{task}"
  learning_rate: 1e-5
