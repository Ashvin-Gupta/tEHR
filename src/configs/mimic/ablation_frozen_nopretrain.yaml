# Ablation 5c: no pretrain; frozen LLM; train head only.
# Usage: sbatch src/submissions/mimic/run.sh ablation_frozen_nopretrain mistral icu_mortality

extends:
  - ../shared/mimic_data.yaml
  - ../shared/training_classifier.yaml

name: "mimic_ablation_frozen_nopretrain_{model}_{task}"

wandb:
  run_name: "ablation-frozen-nopretrain-{model}-{task}"

model:
  pretrained_checkpoint: null
  num_labels: 2
  freeze_llm: true
  train_lora: false
  pooling: "last_token"
  head_type: "linear"
  head_hidden_size: 512
  head_dropout: 0.1
  load_in_4bit: true

output_dir: "/home/ag619/experiments/Results/mimic-ablation-frozen-nopretrain-{model}-{task}"

training:
  output_dir: "/home/ag619/experiments/Results/mimic-ablation-frozen-nopretrain-{model}-{task}"
  learning_rate: 1e-4
  eval_steps: 1000
  save_steps: 1000
