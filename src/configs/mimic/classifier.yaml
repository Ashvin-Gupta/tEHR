# Exp 1: pretrained LLM → LoRA + linear head.
# Usage: sbatch src/submissions/mimic/run.sh classifier mistral icu_mortality

extends:
  - ../shared/mimic_data.yaml
  - ../shared/lora.yaml
  - ../shared/training_classifier.yaml

name: "mimic_classifier_{model}_{task}"

wandb:
  run_name: "classifier-{model}-{task}"

model:
  num_labels: 2
  freeze_llm: true
  train_lora: true
  pooling: "last_token"
  head_type: "linear"
  head_hidden_size: 512
  head_dropout: 0.1

training:
  output_dir: "/home/ag619/experiments/Results/mimic-classifier-{model}-{task}-rerun"
  learning_rate: 1e-6
