# Encoder ablation: freeze MLM-pretrained encoder, train classification head only.
# Parallel to LLM ablation 5b (frozen pretrained backbone + trainable head).
#
# Loads the shared stage-1 MLM checkpoint (same as `encoder.yaml`), skips MLM,
# freezes embeddings+transformer, re-inits the head, trains head only.
#
# Matched supervised protocol: 1 epoch + eval at epoch fractions 0.05..1.00.
#
# Usage:
#   sbatch --gpus=1 src/submissions/isambard/run.sh encoder_frozen_head icu_mortality
#   sbatch --gpus=1 src/submissions/isambard/run.sh encoder_frozen_head hospital_mortality

extends:
  - ../shared/mimic_data.yaml

name: "mimic_encoder_frozen_head_{task}"

model:
  vocab_size: null
  hidden_dim: 512
  num_layers: 6
  num_heads: 8
  ff_dim: 2048
  dropout: 0.1
  max_seq_length: 512
  num_labels: 2
  head_type: "linear"
  head_hidden_size: 256
  pooling: "mean"

training:
  output_dir: "/home/ag619/experiments/Results/mimic-encoder-frozen-head-{task}"
  overwrite_output_dir: true
  epochs: 1
  batch_size: 128
  learning_rate: 1e-3          # higher LR typical for head-only
  weight_decay: 0.01
  dataloader_num_workers: 2
  freeze_encoder: true
  reinit_classifier: true
  eval_epoch_fractions: [0.05, 0.10, 0.20, 0.40, 0.60, 0.80, 1.00]

pretrain:
  enabled: false               # do not re-run MLM
  pretrained_checkpoint: "/home/ag619/experiments/Results/mimic-baselines/encoder_transformer/models/pretrained_encoder_stage1_mlm.pt"
  force_pretrain: false
