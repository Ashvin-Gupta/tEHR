# Ablation 5a: no pretrain; fresh LLM + LoRA + mean-pool head.
# Usage: sbatch src/submissions/mimic/run.sh ablation_no_pretrain_lora mistral icu_mortality

extends:
  - ../shared/mimic_data.yaml
  - ../shared/lora.yaml
  - ../shared/training_classifier.yaml

name: "mimic_ablation_no_pretrain_lora_{model}_{task}"

wandb:
  run_name: "ablation-no-pretrain-lora-{model}-{task}"

model:
  pretrained_checkpoint: null
  num_labels: 2
  freeze_llm: true
  train_lora: true
  pooling: "mean"
  head_type: "linear"
  head_hidden_size: 512
  head_dropout: 0.1

training:
  output_dir: "/home/ag619/experiments/Results/mimic-ablation-no-pretrain-lora-{model}-{task}"
  learning_rate: 1e-5
