# Baseline: custom transformer encoder on full vocabulary (+ optional MLM).
# Usage: sbatch src/submissions/mimic/run.sh encoder icu_mortality

extends:
  - ../shared/mimic_data.yaml

name: "mimic_encoder_transformer_{task}"

model:
  vocab_size: null      # null = full vocabulary
  hidden_dim: 512
  num_layers: 6
  num_heads: 8
  ff_dim: 2048
  dropout: 0.1
  max_seq_length: 512
  num_labels: 2
  head_type: "linear"
  head_hidden_size: 256
  pooling: "mean"

training:
  output_dir: "/home/ag619/experiments/Results/mimic-encoder-transformer-{task}"
  overwrite_output_dir: true
  epochs: 30
  batch_size: 128
  learning_rate: 1e-4
  weight_decay: 0.01
  dataloader_num_workers: 2

pretrain:
  enabled: true
  pretrained_checkpoint: "/home/ag619/experiments/Results/mimic-baselines/encoder_transformer/models/pretrained_encoder_stage1_mlm.pt"
  force_pretrain: false
  use_all_splits_for_mimic: true
  epochs: 30
  batch_size: 128
  learning_rate: 1e-4
  weight_decay: 0.01
  mlm_probability: 0.15
  dataloader_num_workers: 2
