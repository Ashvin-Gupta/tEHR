# Qwen3-8B overlay — merged on top of an experiment config by run.sh
# Pretrain: sbatch .../run.sh pretrain qwen8

model:
  model_name: "unsloth/Qwen3-8B-unsloth-bnb-4bit"
  instruct_model_name: "unsloth/Qwen3-8B-unsloth-bnb-4bit"
  # Update / confirm after pretrain finishes:
  pretrained_checkpoint: "/home/ag619/experiments/Results/Pretrain-qwen8-Mimic/final_model"
  hidden_size: 4096
  use_unsloth: true
  max_length: 12000

# Long-context Unsloth + multi-GPU: mid-train eval desyncs NCCL (see pretrainer).
# eval_on_main_process_only disables mid-train eval; checkpoints still save.
training:
  eval_on_main_process_only: true

# Convenience aliases used by SFT / prompting (instruct variant)
_aliases:
  model_tag: "qwen8"
