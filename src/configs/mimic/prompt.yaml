# Exp 2: zero-shot prompting.
# Usage: sbatch src/submissions/mimic/run.sh prompt mistral hospital_readmission
#
# inference.mode:
#   generate_probability — model writes e.g. 0.23 (default for Mistral)
#   logit_01             — softmax over next-token logits for "0"/"1"
#                          (default for MedGemma via models/medgemma.yaml)

extends:
  - ../shared/mimic_data.yaml

name: "mimic_prompt_{model}_{task}"

prompt:
  filepath: "src/resources/probability_task_prompt.txt"
  use_chat_template: true  # required for mistral-instruct / medgemma-it
  # assistant_prefill is model-specific (see models/*.yaml / PureLLMBaseline):
  #   mistral  → "Answer:" after [/INST]
  #   medgemma → logit_01 + "Answer:" (generate of free-form decimals EOS's)

debug:
  enabled: true
  print_first_n: 5

model:
  load_in_4bit: true

inference:
  mode: generate_probability
  batch_size: 1
  max_new_tokens: 8
  logit_low_threshold: -10.0

output_dir: "/home/ag619/experiments/Results/mimic-prompt-{model}-{task}"
overwrite_output_dir: true

data:
  format: "text"
  sort_by_length: false
