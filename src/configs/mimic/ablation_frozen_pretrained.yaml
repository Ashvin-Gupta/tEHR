# Ablation 5b: pretrained LLM frozen; mean-pool; train head only.
# Usage: sbatch src/submissions/mimic/run.sh ablation_frozen_pretrained mistral hospital_readmission

extends:
  - ../shared/mimic_data.yaml
  - ../shared/training_classifier.yaml

name: "mimic_ablation_frozen_pretrained_{model}_{task}"

wandb:
  run_name: "ablation-frozen-pretrained-{model}-{task}"

model:
  num_labels: 2
  freeze_llm: true
  train_lora: false
  pooling: "last_token"
  head_type: "linear"
  head_hidden_size: 512
  head_dropout: 0.1

training:
  output_dir: "/home/ag619/experiments/Results/mimic-ablation-frozen-pretrained-{model}-{task}"
  learning_rate: 1e-4
