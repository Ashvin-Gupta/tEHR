# Baseline: frozen text embeddings → transformer encoder.
# Usage: sbatch src/submissions/mimic/run.sh text_embedding icu_mortality

extends:
  - ../shared/mimic_data.yaml

name: "mimic_text_embedding_transformer_{task}"

embedder:
  model_name: "Qwen/Qwen3-Embedding-0.6B"
  precomputed_embeddings_path: "/home/ag619/experiments/Results/mimic-baselines/text_embedding_transformer/token_embeddings_qwen3_0.6B.pt"

model:
  num_layers: 6
  num_heads: 8
  ff_dim: 2048
  dropout: 0.1
  max_seq_length: 512
  num_labels: 2
  head_type: "logistic"
  head_hidden_size: 256

wandb:
  enabled: false
  project: "MIMIC-IV-baselines"
  run_name: "text-embedding-transformer-{task}"

training:
  output_dir: "/home/ag619/experiments/Results/mimic-text-embedding-transformer-{task}"
  overwrite_output_dir: true
  epochs: 30
  batch_size: 128
  learning_rate: 1e-4
  weight_decay: 0.01
  dataloader_num_workers: 2
