name: "xgboost_bow_baseline"

hyperparameter_search:
  enabled: false
  selection_metric: "auroc"
  max_depth_values: [5, 6, 7, 8, 9, 10]
  learning_rate_values: [0.01, 0.05, 0.1, 0.2]
  subsample_values: [0.6, 0.8, 1.0]
  gamma_log_uniform:
    min: 0.1
    max: 5.0
  gamma_samples: 2
  random_seed: 42

model:
  max_depth: 6
  learning_rate: 0.1
  n_estimators: 100
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 1
  gamma: 0
  reg_alpha: 0
  reg_lambda: 1

training:
  output_dir: "/home/ag619/experiments/Results/mimic-hospital-readmission-classification/xgboost_bow"
  overwrite_output_dir: true
  early_stopping_rounds: 10
  verbose: true
  n_jobs: -1

data:
  data_dir: "/home/ag619/MIMIC-IV tokensiation"
  vocab_filepath: "/home/ag619/MIMIC-IV tokensiation/vocab.csv"
  aces_label_dir: "/home/ag619/MIMIC_data/labels/hospital_readmission"
  lookup_dir: "/home/ag619/MIMIC_data/hosp"
  dataset: "MIMIC"
  task: "prediction"  # CRITICAL: Must be "prediction" to load ACES labels