name: "xgboost_bow_baseline"

model:
  max_depth: 6
  learning_rate: 0.1
  n_estimators: 100
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 1
  gamma: 0
  reg_alpha: 0
  reg_lambda: 1

training:
  output_dir: "/data/private/ag619/experiments/Results/CPRD/classifer"
  overwrite_output_dir: true
  early_stopping_rounds: 10
  verbose: true
  n_jobs: -1

data:
  cutoff_months: 3
  data_dir: "/data/private/ag619/CPRD_tokenisation"
  vocab_filepath: "/data/private/ag619/CPRD_tokenisation/vocab.csv"
  labels_filepath: "/home/ag619/TextCancEHR2/src/resources/subject_information.csv"
  medical_lookup_filepath: "/home/ag619/TextCancEHR2/src/resources/MedicalDictTranslation2.csv"
  lab_lookup_filepath: "/home/ag619/TextCancEHR2/src/resources/LabLookUP.csv"
  region_lookup_filepath: "/home/ag619/TextCancEHR2/src/resources/RegionLookUp.csv"
  time_lookup_filepath: "/home/ag619/TextCancEHR2/src/resources/TimeLookUp.csv" 