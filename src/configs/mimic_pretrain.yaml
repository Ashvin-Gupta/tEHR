# src/configs/llm-pretrain.yaml

name: "llama_pretraining"

model:
  # Model to pretrain (unsloth/mistral-7b-v0.3-bnb-4bit , "unsloth/Qwen3-8B-Base-unsloth-bnb-4bit", unsloth/Qwen3-1.7B-Base-unsloth-bnb-4bit)
  model_name: "unsloth/mistral-7b-v0.3-bnb-4bit"
  max_length: 8192  # Context window for sequence packing
  hf_token: null

wandb:
  enabled: true
  project: "Pretrain-MIMIC"
  run_name: "Pretrain-Mistral-7B"

lora:
  r: 16
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"

training:
  output_dir: "/rds/general/user/ag619/ephemeral/MIMIC/experiments/Pretrain-Mistral-7B-Pretrain"
  overwrite_output_dir: true

  
  # Training hyperparameters
  epochs: 3
  batch_size: 2
  eval_batch_size: 2
  learning_rate: 1e-5
  weight_decay: 0.05
  warmup_steps: 500
  
  # Gradient settings
  gradient_accumulation_steps: 1  # Effective batch size = gradient_accumulation_steps * batch_size
  gradient_checkpointing: true  # Set to true for large models to save memory
  
  # Precision
  fp16: false  # Use FP16 for faster training (if GPU supports it)
  bf16: true  # Use BF16 for better numerical stability (if GPU supports it - only does for NVIDA Ampere GPUs)
  
  # Logging and saving
  logging_steps: 50
  eval_steps: 250
  save_steps: 1000
  save_total_limit: 3  # Keep only 1 best checkpoint

data:
  cutoff_months: 1  # Remove last 1 month before diagnosis for cancer patients
  data_dir: "/rds/general/user/ag619/home/ashvin/MEDS/tokenised_data/MIMIC-IV tokensiation"
  vocab_filepath: "/rds/general/user/ag619/home/ashvin/MEDS/tokenised_data/MIMIC-IV tokensiation/vocab.csv"
  aces_label_dir: "/rds/general/user/ag619/home/ashvin/MIMIC-IV/MEDS-Output/labels/icu_mortality"
  lookup_dir: "/rds/general/user/ag619/home/ashvin/MIMIC-IV/mimic-iv-3.1/hosp"
  dataset: "MIMIC"
